name: Yunxiao Weekly Report

on:
  schedule:
  # UTC 时间 01:00 即北京时间每周一 09:00
  - cron: '0 1 * * 1'
  workflow_dispatch: # 支持在 GitHub 页面手动点击按钮触发测试

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run weekly report script
        # 指定在 weekly_report 目录下运行脚本
        working-directory: ./weekly_report
        run: python weekly_report.py
