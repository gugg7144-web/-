name: Yunxiao Weekly Report

on:
  schedule:
    - cron: '0 9 * * 5'
  workflow_dispatch:

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run weekly report script
        working-directory: ./weekly_report
        run: python weekly_report.py
